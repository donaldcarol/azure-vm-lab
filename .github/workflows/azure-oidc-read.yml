name: Azure OIDC Read test
on:
  workflow_dispatch:
    inputs:
      resourceGroup:
        description: "The name of the resource group to list"
        required: true
        type: string
        default: "RG-lab"

  workflow_call:
    inputs:
      resourceGroup:
        description: "The name of the resource group to list"
        required: true
        type: string
        

    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true

permissions:
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: azure login
        uses: azure/login@v2

        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Show Azure account and resource groups
        env:
          TARGET_RG: ${{ inputs.resourceGroup }}
        run: |
          az account show --output table
          az group show --name "$TARGET_RG" --output table



      
